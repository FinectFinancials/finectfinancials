name: Deploy site to GitHub Pages

# The copy lives in site/, which "deploy from a branch" cannot serve -- that
# mode only offers / and /docs. Deploying through Actions keeps the folder
# where it is and lets us adjust the preview at publish time without touching
# the committed files.

# Pages deploys from the default branch: the github-pages environment
# restricts deployments to it, so a run from any other branch is blocked
# before its first step.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # The preview must not compete with finect.nl for the same queries, so
      # it is published noindex. The switch is the CNAME file: as long as the
      # site is served from github.io there is none, and everything is marked
      # noindex. Add site/CNAME with the real domain and this step skips
      # itself -- so going live cannot be forgotten, and cannot be done by
      # accident either.
      - name: Keep the preview out of search results
        run: |
          set -euo pipefail

          if [ -f site/CNAME ]; then
            echo "site/CNAME present ($(cat site/CNAME)) -- publishing indexable."
            exit 0
          fi

          echo "No site/CNAME -- publishing as a noindex preview."
          find site -name '*.html' -print0 | xargs -0 -r sed -i \
            's|<head>|<head><meta name="robots" content="noindex, nofollow">|'
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          rm -f site/sitemap.xml

          echo "Pages marked noindex: $(grep -rl 'content="noindex, nofollow"' site --include='*.html' | wc -l)"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - id: deploy
        uses: actions/deploy-pages@v4
